<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" role="img" aria-label="ResonantiA architecture overview">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="920" height="320" rx="16" fill="#09090b"/>
  <text x="460" y="36" text-anchor="middle" fill="#fafafa" font-family="system-ui,sans-serif" font-size="18" font-weight="700">ResonantiA � production agent stack (sanitized)</text>
  <text x="460" y="58" text-anchor="middle" fill="#a1a1aa" font-family="system-ui,sans-serif" font-size="12">Intake � plan � tools � vetting � answer � IAR on every step</text>
  <!-- boxes -->
  <g filter="url(#shadow)">
    <rect x="40" y="88" width="130" height="64" rx="10" fill="#18181b" stroke="#3f3f46"/>
    <text x="105" y="116" text-anchor="middle" fill="#e4e4e7" font-size="13" font-weight="600">Keyholder</text>
    <text x="105" y="136" text-anchor="middle" fill="#a1a1aa" font-size="11">intent / policy</text>

    <rect x="210" y="88" width="150" height="64" rx="10" fill="#18181b" stroke="url(#g1)" stroke-width="2"/>
    <text x="285" y="116" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="600">Workflow engine</text>
    <text x="285" y="136" text-anchor="middle" fill="#a1a1aa" font-size="11">80+ blueprints</text>

    <rect x="400" y="72" width="120" height="48" rx="8" fill="#121216" stroke="#3f3f46"/>
    <text x="460" y="94" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="600">Search</text>
    <text x="460" y="110" text-anchor="middle" fill="#71717a" font-size="10">live feeds</text>

    <rect x="540" y="72" width="120" height="48" rx="8" fill="#121216" stroke="#3f3f46"/>
    <text x="600" y="94" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="600">Causal + ABM</text>
    <text x="600" y="110" text-anchor="middle" fill="#71717a" font-size="10">lag / emergent</text>

    <rect x="400" y="132" width="120" height="48" rx="8" fill="#121216" stroke="#3f3f46"/>
    <text x="460" y="154" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="600">LLM synth</text>
    <text x="460" y="170" text-anchor="middle" fill="#71717a" font-size="10">grounded</text>

    <rect x="540" y="132" width="120" height="48" rx="8" fill="#121216" stroke="#3f3f46"/>
    <text x="600" y="154" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="600">Vetting</text>
    <text x="600" y="170" text-anchor="middle" fill="#71717a" font-size="10">IAR gate</text>

    <rect x="700" y="88" width="150" height="64" rx="10" fill="#18181b" stroke="#22d3ee" stroke-width="2"/>
    <text x="775" y="116" text-anchor="middle" fill="#a5f3fc" font-size="13" font-weight="600">Answer + trace</text>
    <text x="775" y="136" text-anchor="middle" fill="#a1a1aa" font-size="11">confidence band</text>

    <rect x="210" y="200" width="640" height="56" rx="10" fill="#0c0c0f" stroke="#3f3f46"/>
    <text x="530" y="224" text-anchor="middle" fill="#86efac" font-size="12" font-weight="600">ThoughtTrail � 7M+ IAR entries � SPR knowledge graph � Zepto compression</text>
    <text x="530" y="244" text-anchor="middle" fill="#71717a" font-size="11">Same spine as interactive demo theater above</text>
  </g>
  <!-- arrows -->
  <g stroke="#52525b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M170 120 H210"/>
    <path d="M360 120 H400"/>
    <path d="M520 96 H540"/>
    <path d="M520 156 H540"/>
    <path d="M660 120 H700"/>
    <path d="M285 152 V200"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#52525b"/>
    </marker>
  </defs>
</svg>
