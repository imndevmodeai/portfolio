<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="Experience Capture creates authentic stars">
  <rect width="960" height="640" fill="#f8fafc"/>
  <rect width="960" height="60" fill="#0f172a"/>
  <text x="28" y="38" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">Experience Capture - create stars without inventing them</text>
  <text x="700" y="38" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="12">this week - scrubbed</text>

  <rect x="28" y="90" width="220" height="200" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="48" y="130" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">HAPPY MOMENTS</text>
  <text x="48" y="180" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">12</text>
  <text x="48" y="220" fill="#475569" font-family="Arial,Helvetica,sans-serif" font-size="13">Finished jobs, tips, and</text>
  <text x="48" y="242" fill="#475569" font-family="Arial,Helvetica,sans-serif" font-size="13">thank-you texts detected</text>

  <rect x="268" y="90" width="220" height="200" rx="12" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
  <text x="288" y="130" fill="#0369a1" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">REVIEW ASKS QUEUED</text>
  <text x="288" y="180" fill="#0c4a6e" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">4</text>
  <text x="288" y="220" fill="#475569" font-family="Arial,Helvetica,sans-serif" font-size="13">One-tap Google asks</text>
  <text x="288" y="242" fill="#475569" font-family="Arial,Helvetica,sans-serif" font-size="13">at peak satisfaction</text>

  <rect x="508" y="90" width="220" height="200" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="528" y="130" fill="#b45309" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">AUTHENTIC STARS</text>
  <text x="528" y="180" fill="#92400e" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">3</text>
  <text x="528" y="220" fill="#475569" font-family="Arial,Helvetica,sans-serif" font-size="13">Real customer reviews</text>
  <text x="528" y="242" fill="#475569" font-family="Arial,Helvetica,sans-serif" font-size="13">No fabricated ratings</text>

  <rect x="748" y="90" width="184" height="200" rx="12" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <text x="768" y="130" fill="#166534" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">GATE</text>
  <text x="768" y="175" fill="#14532d" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">Human</text>
  <text x="768" y="200" fill="#14532d" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">Publish</text>
  <text x="768" y="240" fill="#166534" font-family="Arial,Helvetica,sans-serif" font-size="12">You approve asks</text>
  <text x="768" y="262" fill="#166534" font-family="Arial,Helvetica,sans-serif" font-size="12">before they send</text>

  <rect x="28" y="320" width="904" height="180" rx="12" fill="#0f172a"/>
  <text x="48" y="365" fill="#67e8f9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">Pipeline (buyer view)</text>
  <text x="48" y="400" fill="#e2e8f0" font-family="Arial,Helvetica,sans-serif" font-size="14">Detect happy moment -&gt; Queue authentic ask -&gt; Customer posts real star -&gt; Review Desk drafts reply</text>
  <text x="48" y="435" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="13">We refuse to invent praise. We refuse to leave real praise unpublished.</text>
  <text x="48" y="470" fill="#86efac" font-family="Arial,Helvetica,sans-serif" font-size="13">Demo numbers are illustrative scrub - not a live client claim.</text>

  <rect x="28" y="530" width="904" height="80" rx="12" fill="#1e3a8a"/>
  <text x="48" y="578" fill="#bfdbfe" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700">SKU: Experience Capture - authentic stars from goodwill you already earned.</text>
</svg>
