<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="YouTube campaign storyboard with human publish gate">
  <rect width="960" height="640" fill="#0f0f0f"/>
  <rect width="960" height="56" fill="#212121"/>
  <rect x="28" y="16" width="36" height="24" rx="6" fill="#FF0000"/>
  <polygon points="40,20 40,36 52,28" fill="#fff"/>
  <text x="76" y="36" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">YouTube · campaign storyboard</text>
  <rect x="700" y="14" width="232" height="28" rx="14" fill="#422006" stroke="#fbbf24"/>
  <text x="720" y="33" fill="#fde68a" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">PUBLISH = human gate</text>

  <text x="28" y="90" fill="#a3a3a3" font-family="Arial,Helvetica,sans-serif" font-size="13">Channel: Acme Dental (owned) · 3 clip packet · review before upload</text>

  <!-- Thumb 1 -->
  <rect x="28" y="115" width="280" height="168" rx="12" fill="#27272a"/>
  <rect x="28" y="115" width="280" height="168" rx="12" fill="none" stroke="#404040"/>
  <rect x="28" y="115" width="280" height="100" fill="#3f3f46"/>
  <text x="120" y="175" fill="#fafafa" font-family="Arial,Helvetica,sans-serif" font-size="42">1</text>
  <text x="44" y="240" fill="#fafafa" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">Meet the team</text>
  <text x="44" y="262" fill="#a3a3a3" font-family="Arial,Helvetica,sans-serif" font-size="12">0:45 · welcome + faces</text>

  <!-- Thumb 2 -->
  <rect x="340" y="115" width="280" height="168" rx="12" fill="#27272a"/>
  <rect x="340" y="115" width="280" height="100" fill="#3f3f46"/>
  <text x="432" y="175" fill="#fafafa" font-family="Arial,Helvetica,sans-serif" font-size="42">2</text>
  <text x="356" y="240" fill="#fafafa" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">What first visit feels like</text>
  <text x="356" y="262" fill="#a3a3a3" font-family="Arial,Helvetica,sans-serif" font-size="12">1:10 · walkthrough</text>

  <!-- Thumb 3 -->
  <rect x="652" y="115" width="280" height="168" rx="12" fill="#27272a"/>
  <rect x="652" y="115" width="280" height="100" fill="#3f3f46"/>
  <text x="744" y="175" fill="#fafafa" font-family="Arial,Helvetica,sans-serif" font-size="42">3</text>
  <text x="668" y="240" fill="#fafafa" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">Review reply honesty</text>
  <text x="668" y="262" fill="#a3a3a3" font-family="Arial,Helvetica,sans-serif" font-size="12">0:55 · how we fix misses</text>

  <!-- Script panel -->
  <rect x="28" y="310" width="580" height="220" rx="12" fill="#18181b" stroke="#3f3f46"/>
  <text x="48" y="345" fill="#67e8f9" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">Clip 1 script (draft for your review)</text>
  <text x="48" y="380" fill="#e4e4e7" font-family="Arial,Helvetica,sans-serif" font-size="13">"Hi — I'm Dr. Lee at Acme Dental. If Google showed you</text>
  <text x="48" y="402" fill="#e4e4e7" font-family="Arial,Helvetica,sans-serif" font-size="13">an old one-star and no reply, that ends here. We answer</text>
  <text x="48" y="424" fill="#e4e4e7" font-family="Arial,Helvetica,sans-serif" font-size="13">every review within a day, and this video is how we show</text>
  <text x="48" y="446" fill="#e4e4e7" font-family="Arial,Helvetica,sans-serif" font-size="13">you the real people behind the listing."</text>
  <text x="48" y="488" fill="#a1a1aa" font-family="Arial,Helvetica,sans-serif" font-size="12">Status: QUEUED_FOR_KEYHOLDER_REVIEW · not uploaded</text>
  <text x="48" y="512" fill="#fbbf24" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">You tap Publish. ArchE never auto-posts.</text>

  <rect x="628" y="310" width="304" height="220" rx="12" fill="#14532d" stroke="#22c55e"/>
  <text x="648" y="345" fill="#bbf7d0" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">Packet includes</text>
  <text x="648" y="380" fill="#dcfce7" font-family="Arial,Helvetica,sans-serif" font-size="13">· 3 titles + descriptions</text>
  <text x="648" y="408" fill="#dcfce7" font-family="Arial,Helvetica,sans-serif" font-size="13">· Thumbnail text options</text>
  <text x="648" y="436" fill="#dcfce7" font-family="Arial,Helvetica,sans-serif" font-size="13">· Caption / end-screen CTAs</text>
  <text x="648" y="464" fill="#dcfce7" font-family="Arial,Helvetica,sans-serif" font-size="13">· Claim ledger (proof links)</text>
  <text x="648" y="500" fill="#86efac" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">Document you receive</text>

  <rect x="28" y="555" width="904" height="60" rx="10" fill="#1e3a8a"/>
  <text x="48" y="592" fill="#dbeafe" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700">This is a real campaign screen — not a metadata table. You walk away with the packet.</text>
</svg>
