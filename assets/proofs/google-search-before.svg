<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="Google search BEFORE - thin or damaged presence">
  <rect width="960" height="640" fill="#ffffff"/>
  <rect width="960" height="52" fill="#f8f9fa" stroke="#e8eaed"/>
  <text x="24" y="34" fill="#b91c1c" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">BEFORE - what a customer sees today (scrubbed demo)</text>
  <text x="700" y="34" fill="#5f6368" font-family="Arial,Helvetica,sans-serif" font-size="12">demo plan - not a live client</text>

  <!-- Google wordmark -->
  <text x="48" y="110" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700">
    <tspan fill="#4285F4">G</tspan><tspan fill="#EA4335">o</tspan><tspan fill="#FBBC05">o</tspan><tspan fill="#4285F4">g</tspan><tspan fill="#34A853">l</tspan><tspan fill="#EA4335">e</tspan>
  </text>

  <!-- Search box -->
  <rect x="48" y="130" width="720" height="48" rx="24" fill="#fff" stroke="#dfe1e5" stroke-width="1.5"/>
  <text x="72" y="161" fill="#202124" font-family="Arial,Helvetica,sans-serif" font-size="16">Acme Dental Kalamazoo reviews</text>
  <circle cx="730" cy="154" r="10" fill="none" stroke="#4285F4" stroke-width="2"/>
  <line x1="737" y1="161" x2="748" y2="172" stroke="#4285F4" stroke-width="2"/>

  <!-- Tabs -->
  <text x="48" y="210" fill="#1a73e8" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600">All</text>
  <text x="90" y="210" fill="#5f6368" font-family="Arial,Helvetica,sans-serif" font-size="13">Maps</text>
  <text x="145" y="210" fill="#5f6368" font-family="Arial,Helvetica,sans-serif" font-size="13">Images</text>
  <line x1="48" y1="218" x2="72" y2="218" stroke="#1a73e8" stroke-width="3"/>
  <line x1="48" y1="226" x2="912" y2="226" stroke="#e8eaed"/>

  <!-- Result count -->
  <text x="48" y="255" fill="#70757a" font-family="Arial,Helvetica,sans-serif" font-size="13">About 18 results (0.32 seconds)</text>

  <!-- Business panel - weak -->
  <rect x="48" y="275" width="560" height="150" rx="8" fill="#fff" stroke="#dadce0"/>
  <text x="68" y="310" fill="#202124" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700">Acme Dental</text>
  <text x="68" y="340" fill="#d93025" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600">2.8 stars · 6 Google reviews</text>
  <text x="68" y="368" fill="#5f6368" font-family="Arial,Helvetica,sans-serif" font-size="14">Dentist · Kalamazoo, MI</text>
  <text x="68" y="396" fill="#d93025" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600">2 one-star reviews with NO owner reply</text>

  <!-- Side note -->
  <rect x="640" y="275" width="272" height="150" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="660" y="310" fill="#991b1b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">Problem</text>
  <text x="660" y="340" fill="#7f1d1d" font-family="Arial,Helvetica,sans-serif" font-size="13">Thin presence</text>
  <text x="660" y="362" fill="#7f1d1d" font-family="Arial,Helvetica,sans-serif" font-size="13">Unanswered complaints</text>
  <text x="660" y="384" fill="#7f1d1d" font-family="Arial,Helvetica,sans-serif" font-size="13">No owned video / posts</text>
  <text x="660" y="406" fill="#7f1d1d" font-family="Arial,Helvetica,sans-serif" font-size="13">Customer walks away</text>

  <!-- Review cards -->
  <rect x="48" y="445" width="430" height="100" rx="8" fill="#fff" stroke="#dadce0"/>
  <text x="68" y="475" fill="#202124" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600">J. M. · 1 star · 3 weeks ago</text>
  <text x="68" y="500" fill="#3c4043" font-family="Arial,Helvetica,sans-serif" font-size="13">"Waited 45 minutes. Front desk ignored us."</text>
  <text x="68" y="525" fill="#d93025" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600">Owner response: none</text>

  <rect x="498" y="445" width="414" height="100" rx="8" fill="#fff" stroke="#dadce0"/>
  <text x="518" y="475" fill="#202124" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600">S. K. · 1 star · 1 month ago</text>
  <text x="518" y="500" fill="#3c4043" font-family="Arial,Helvetica,sans-serif" font-size="13">"Billing surprise. Still no callback."</text>
  <text x="518" y="525" fill="#d93025" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600">Owner response: none</text>

  <rect x="48" y="560" width="864" height="56" rx="8" fill="#111827"/>
  <text x="68" y="595" fill="#fde68a" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700">This is the starting screenshot we capture for you — before any campaign drafts.</text>
</svg>
