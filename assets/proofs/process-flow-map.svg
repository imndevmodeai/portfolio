<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Process flow map  Twilio n8n CRM lead automation">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#121a2b"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <text x="32" y="40" fill="#e8eef9" font-family="IBM Plex Sans,Helvetica,Arial,sans-serif" font-size="20" font-weight="600">Process we build for you</text>
  <text x="32" y="64" fill="#94a3b8" font-family="IBM Plex Sans,Helvetica,Arial,sans-serif" font-size="13">Lead SMS ’ Twilio ’ n8n ’ CRM classify ’ follow-up · optional Notion / Shopify / Gmail stubs</text>
  <text x="920" y="40" text-anchor="end" fill="#64748b" font-family="IBM Plex Mono,monospace" font-size="11">simulation map</text>

  <!-- Lane labels -->
  <text x="32" y="110" fill="#f22f46" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700">TWILIO</text>
  <text x="32" y="250" fill="#ea4b71" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700">n8n</text>
  <text x="32" y="390" fill="#ff7a59" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700">CRM</text>
  <text x="32" y="490" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700">STUBS</text>

  <!-- Twilio nodes -->
  <rect x="120" y="88" width="160" height="56" rx="10" fill="#1e293b" stroke="#f22f46" stroke-width="2"/>
  <text x="200" y="112" text-anchor="middle" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="10">INBOUND</text>
  <text x="200" y="132" text-anchor="middle" fill="#e8eef9" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600">Lead SMS</text>

  <rect x="360" y="88" width="180" height="56" rx="10" fill="#1e293b" stroke="#f22f46" stroke-width="2"/>
  <text x="450" y="112" text-anchor="middle" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="10">CONSOLE</text>
  <text x="450" y="132" text-anchor="middle" fill="#e8eef9" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600">Twilio Webhook</text>

  <line x1="280" y1="116" x2="360" y2="116" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- n8n nodes -->
  <rect x="120" y="220" width="140" height="56" rx="10" fill="#1e293b" stroke="#ea4b71" stroke-width="2"/>
  <text x="190" y="244" text-anchor="middle" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="10">TRIGGER</text>
  <text x="190" y="264" text-anchor="middle" fill="#e8eef9" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Webhook in</text>

  <rect x="300" y="220" width="140" height="56" rx="10" fill="#1e293b" stroke="#5b6abf" stroke-width="2"/>
  <text x="370" y="244" text-anchor="middle" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="10">CODE</text>
  <text x="370" y="264" text-anchor="middle" fill="#e8eef9" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Normalize</text>

  <rect x="480" y="220" width="140" height="56" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="550" y="244" text-anchor="middle" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="10">HTTP</text>
  <text x="550" y="264" text-anchor="middle" fill="#e8eef9" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600">CRM Upsert</text>

  <rect x="660" y="220" width="140" height="56" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="730" y="244" text-anchor="middle" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="10">AI / RULES</text>
  <text x="730" y="264" text-anchor="middle" fill="#e8eef9" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Classify</text>

  <line x1="260" y1="248" x2="300" y2="248" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="248" x2="480" y2="248" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="248" x2="660" y2="248" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- vertical from Twilio webhook to n8n -->
  <line x1="450" y1="144" x2="450" y2="190" stroke="#64748b" stroke-width="2"/>
  <line x1="190" y1="190" x2="450" y2="190" stroke="#64748b" stroke-width="2"/>
  <line x1="190" y1="190" x2="190" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Gate diamond -->
  <path d="M820,248 L880,218 L940,248 L880,278 Z" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="880" y="244" text-anchor="middle" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="9">IF</text>
  <text x="880" y="258" text-anchor="middle" fill="#e8eef9" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="600">Gate</text>
  <line x1="800" y1="248" x2="820" y2="248" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CRM -->
  <rect x="300" y="360" width="200" height="56" rx="10" fill="#1e293b" stroke="#ff7a59" stroke-width="2"/>
  <text x="400" y="384" text-anchor="middle" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="10">HUBSPOT / CLOSE / GHL</text>
  <text x="400" y="404" text-anchor="middle" fill="#e8eef9" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600">Contact of record</text>

  <line x1="550" y1="276" x2="550" y2="330" stroke="#64748b" stroke-width="2"/>
  <line x1="400" y1="330" x2="550" y2="330" stroke="#64748b" stroke-width="2"/>
  <line x1="400" y1="330" x2="400" y2="360" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Human review branch -->
  <rect x="720" y="360" width="160" height="56" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="800" y="384" text-anchor="middle" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="10">LOW CONF</text>
  <text x="800" y="404" text-anchor="middle" fill="#e8eef9" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Human review</text>
  <line x1="880" y1="278" x2="880" y2="330" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="800" y1="330" x2="880" y2="330" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="800" y1="330" x2="800" y2="360" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Outbound -->
  <rect x="120" y="360" width="140" height="56" rx="10" fill="#1e293b" stroke="#f22f46" stroke-width="2"/>
  <text x="190" y="384" text-anchor="middle" fill="#94a3b8" font-family="Helvetica,Arial,sans-serif" font-size="10">OUTBOUND</text>
  <text x="190" y="404" text-anchor="middle" fill="#e8eef9" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Ack SMS + STOP</text>
  <line x1="880" y1="218" x2="880" y2="180" stroke="#4ade80" stroke-width="2"/>
  <line x1="190" y1="180" x2="880" y2="180" stroke="#4ade80" stroke-width="2"/>
  <line x1="190" y1="180" x2="190" y2="360" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="172" fill="#4ade80" font-family="Helvetica,Arial,sans-serif" font-size="10">gate PASS ’ outbound</text>

  <!-- Stubs -->
  <rect x="280" y="460" width="120" height="48" rx="8" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="340" y="488" text-anchor="middle" fill="#e8eef9" font-family="Helvetica,Arial,sans-serif" font-size="12">Notion</text>
  <rect x="420" y="460" width="120" height="48" rx="8" fill="#1e293b" stroke="#95bf47" stroke-width="1.5"/>
  <text x="480" y="488" text-anchor="middle" fill="#e8eef9" font-family="Helvetica,Arial,sans-serif" font-size="12">Shopify</text>
  <rect x="560" y="460" width="120" height="48" rx="8" fill="#1e293b" stroke="#0b57d0" stroke-width="1.5"/>
  <text x="620" y="488" text-anchor="middle" fill="#e8eef9" font-family="Helvetica,Arial,sans-serif" font-size="12">Gmail</text>
  <line x1="550" y1="276" x2="550" y2="440" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="340" y1="440" x2="620" y2="440" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="340" y1="440" x2="340" y2="460" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="480" y1="440" x2="480" y2="460" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="620" y1="440" x2="620" y2="460" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>

  <text x="32" y="530" fill="#64748b" font-family="Helvetica,Arial,sans-serif" font-size="11">What we deliver · scrubbed demo · your CRM + Twilio credentials at cutover</text>
</svg>
