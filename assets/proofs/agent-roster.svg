<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="Reputation agent roster assigned to your business">
  <rect width="960" height="640" fill="#0b1220"/>
  <rect width="960" height="64" fill="#111827"/>
  <text x="28" y="40" fill="#67e8f9" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700">Agents assigned to your business</text>
  <text x="620" y="40" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="13">demo scrub � human Publish gate ON</text>

  <rect x="28" y="92" width="290" height="150" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="48" y="128" fill="#e0f2fe" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700">Experience Capture</text>
  <text x="48" y="156" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="13">Detects happy job moments.</text>
  <text x="48" y="178" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="13">Queues authentic review asks.</text>
  <text x="48" y="210" fill="#4ade80" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">MISSION: create stars without inventing them</text>

