  <text x="662" y="178" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="13">Scripts + thumbs � never auto-uploads.</text>
  <text x="662" y="210" fill="#f9a8d4" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">MISSION: owned trust substrate</text>

