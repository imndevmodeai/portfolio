  <text x="355" y="128" fill="#ede9fe" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700">Social Media Agent</text>
  <text x="355" y="156" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="13">Harvests already-positive experience.</text>
  <text x="355" y="178" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="13">Turns praise into GBP / social drafts.</text>
  <text x="355" y="210" fill="#c4b5fd" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">MISSION: brand solidification + market capture</text>

