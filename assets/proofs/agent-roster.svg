  <text x="48" y="334" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="13">Drafts owner-voice replies.</text>
  <text x="48" y="356" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="13">Detractor SLA + escalation path.</text>
  <text x="48" y="388" fill="#fde68a" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">MISSION: answered presence, not silence</text>

  <rect x="487" y="270" width="445" height="150" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
