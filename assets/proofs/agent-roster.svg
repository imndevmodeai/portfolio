  <text x="507" y="334" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="13">Blocks fake-star claims.</text>
  <text x="507" y="356" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="13">Requires your Publish token.</text>
  <text x="507" y="388" fill="#6ee7b7" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">MISSION: evidence + gates before public</text>

  <rect x="28" y="450" width="904" height="150" rx="12" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <text x="48" y="495" fill="#bbf7d0" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">What you get: a staffed flywheel  not a calendar template.</text>
  <text x="48" y="530" fill="#e2e8f0" font-family="Arial,Helvetica,sans-serif" font-size="14">Each agent has one job. You approve every public Publish. Demo scrub sample only.</text>
  <text x="48" y="562" fill="#86efac" font-family="Arial,Helvetica,sans-serif" font-size="13">Outcome language for buyers. Internal recipes stay behind the curtain.</text>
